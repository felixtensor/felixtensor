name: Validate Dependabot updates

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'felixtensor/felixtensor'
    runs-on: ubuntu-latest

    steps:
      - name: Check out proposed update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate validation card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=felixtensor&show_icons=true&theme=transparent
          path: ${{ runner.temp }}/stats.svg
          token: ${{ github.token }}

      - name: Validate generated SVG
        shell: bash
        run: |
          test -s "${RUNNER_TEMP}/stats.svg"
          grep -Eq '<svg([[:space:]>])' "${RUNNER_TEMP}/stats.svg"
